name: Build APK

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Stage APK in release/
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Compteur.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Compteur
          path: release/Compteur.apk
          if-no-files-found: error

      - name: Commit APK to branch
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && !contains(github.event.head_commit.message, '[skip ci]')
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/Compteur.apk
          if git diff --cached --quiet; then
            echo "Aucun changement d'APK à commiter."
            exit 0
          fi
          git commit -m "ci: build APK [skip ci]"
          branch="${GITHUB_REF#refs/heads/}"
          for i in 1 2 3 4 5; do
            git push origin "HEAD:${branch}" && exit 0
            echo "Push refusé, rebase puis nouvelle tentative (#$i)..."
            git fetch origin "${branch}"
            git rebase "origin/${branch}" || { git rebase --abort; exit 1; }
            sleep $((i * 2))
          done
          echo "Push impossible après plusieurs tentatives." >&2
          exit 1

      - name: Read app version
        id: appver
        run: |
          v=$(grep -E '^[[:space:]]*versionName' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=v${v}" >> "$GITHUB_OUTPUT"

      - name: Create / update release with APK
        if: github.event_name == 'push' || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.appver.outputs.version }}
          name: Compteur ${{ steps.appver.outputs.version }}
          files: release/Compteur.apk
          make_latest: "true"
          generate_release_notes: true
