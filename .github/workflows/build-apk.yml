name: Build APK

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Stage APK in release/
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/compteur-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: compteur-debug-apk
          path: release/compteur-debug.apk
          if-no-files-found: error

      - name: Commit APK to branch
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/compteur-debug.apk
          if git diff --cached --quiet; then
            echo "Aucun changement d'APK à commiter."
          else
            git commit -m "ci: build APK [skip ci]"
            git push origin HEAD:${GITHUB_REF#refs/heads/}
          fi

      - name: Attach APK to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release/compteur-debug.apk
